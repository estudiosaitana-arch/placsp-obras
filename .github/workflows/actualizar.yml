name: Actualizar datos PLACSP

on:
  schedule:
    - cron: "17 4 * * 1"   # lunes 04:17 UTC
  workflow_dispatch:
    inputs:
      periodos:
        description: 'Periodos: "auto" (mes anterior + mes en curso), un año "2025", meses "202601-202609" o lista "2024,2025"'
        required: true
        default: "auto"
      fuentes:
        description: 'Fuentes: placsp, agregadas o ambas separadas por coma'
        required: true
        default: "placsp,agregadas"

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar y parsear
        timeout-minutes: 300
        continue-on-error: true
        run: python placsp.py descargar --periodos "${{ github.event.inputs.periodos || 'auto' }}" --fuentes "${{ github.event.inputs.fuentes || 'placsp,agregadas' }}"

      - name: Construir fichas
        if: always()
        run: python placsp.py construir

      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs/data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Datos PLACSP: ${{ github.event.inputs.periodos || 'auto' }} ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 10; done
